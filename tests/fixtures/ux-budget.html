<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Fixture budgets UX</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px system-ui; }
      button { min-height: 48px; }
      #fixture-list { display: flex; flex-direction: column; width: min(100%, 40rem); }
      .fixture-item { min-height: 24px; border-bottom: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <button id="reorder" type="button">Réagencer</button>
    <output id="feedback" aria-live="polite"></output>
    <div id="fixture-list"></div>
    <script>
      const list = document.querySelector("#fixture-list");
      for (let index = 1; index <= 100; index += 1) {
        const item = document.createElement("div");
        item.className = "fixture-item";
        item.dataset.id = `fixture-${String(index).padStart(3, "0")}`;
        item.textContent = `Élément ${index}`;
        list.append(item);
      }
      document.querySelector("#reorder").addEventListener("click", () => {
        const feedback = performance.now();
        document.querySelector("#feedback").textContent = "Réagencement enregistré";
        list.append(list.firstElementChild);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          document.dispatchEvent(new CustomEvent("fixture-settled", { detail: { feedback, stable: performance.now() } }));
        }));
      });
    </script>
  </body>
</html>
